name: Hata kayıtları

# Canlı sitedeki hata kayıtlarını GitHub issue'larıyla eşler (scripts/incident_sync.py):
# yeni hata → issue; issue kapandı + düzeltme canlıda → "düzeltme yayında"; 24 saat temiz → "çözüldü";
# hata tekrar görüldü → issue yeniden açılır.
on:
  schedule:
    - cron: "7,37 * * * *"
  issues:
    types: [closed, reopened]
  workflow_run:
    # Deploy bitince: kapanan issue'ların düzeltmesi canlıya çıktı mı diye hemen bak.
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: incident-sync
  cancel-in-progress: false

jobs:
  sync:
    if: (github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'hata-kaydı')) && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Senkronize et
        env:
          LINKO_URL: https://job.ai-org.online
          LINKO_LOG_KEY: ${{ secrets.LINKO_LOG_KEY || secrets.LINKO_ADMIN_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/incident_sync.py
