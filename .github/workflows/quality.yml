name: Kod ve arayüz doğrulaması

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Python doğrulama araçlarını kur
        run: python -m pip install -r requirements-dev.txt
      - name: Python hata kontrolleri
        run: python -m ruff check jobapp tests run.py run_accountless.py serve_service.py
      - name: Hata durumlarında davranış ve log gizliliği
        run: python -m unittest discover -s tests -p test_fallback_logging.py
      - name: Arama gecikmesi, Unicode ve LIKE regresyonları
        run: python -m unittest discover -s tests -p test_search_safety.py
      - name: JavaScript sözdizimini kontrol et
        run: |
          node --check jobapp/static/js/app.js
          node --check jobapp/static/js/dashboard.js
          node --check tests/ui_smoke.cjs
      - name: Tarayıcı test araçlarını kur
        run: |
          npm install --no-save --package-lock=false playwright@1.61.1
          npx --no-install playwright install --with-deps chromium
      - name: İzole arayüz testi
        env:
          LINKO_PYTHON: python
          LINKO_UI_PORT: "8027"
        run: node tests/ui_smoke.cjs
      - name: Arayüz test çıktılarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke
          path: |
            .qa/*.png
            .qa/ui-smoke-result.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
